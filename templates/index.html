<!DOCTYPE html>
<html>
<head>
    <title>Buzzheavier Extractor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            padding: 40px;
        }
        textarea {
            width: 100%;
            height: 160px;
            padding: 10px;
        }
        button {
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
        }
        pre {
            background: #020617;
            padding: 15px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<h2>🚀 Buzzheavier Direct Link Extractor</h2>

<form method="post" action="/extract">
    <textarea name="urls" placeholder="Paste Buzzheavier URLs here..."></textarea><br>
    <button type="submit">Extract</button>
</form>

{% if results %}
<h3>Results:</h3>
<pre>
{% for r in results %}
{{ r }}
{% endfor %}
</pre>
{% endif %}

</body>
</html>
